<svg xmlns="http://www.w3.org/2000/svg" width="530" height="6600" viewBox="0 0 530 6600">
<defs>
  <linearGradient id="worldBg" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0%" stop-color="#1d2730"/>
    <stop offset="4%" stop-color="#273742"/>
    <stop offset="18%" stop-color="#2f6046"/>
    <stop offset="28%" stop-color="#d7b46b"/>
    <stop offset="38%" stop-color="#5f9e6c"/>
    <stop offset="52%" stop-color="#2f6b47"/>
