  <linearGradient id="roadFill" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#565d66"/>
    <stop offset=".5" stop-color="#707780"/>
    <stop offset="1" stop-color="#565d66"/>
  </linearGradient>
  <filter id="roadShadow" x="-40%" y="-10%" width="180%" height="120%">
    <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000" flood-opacity=".34"/>
  </filter>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="5" cy="5" r="2" fill="#fff" opacity=".08"/>
  </pattern>
</defs>

<rect width="530" height="6600" fill="url(#worldBg)"/>
<rect width="530" height="6600" fill="url(#dots)"/>

<!-- Große, comicartige Landschaftsflächen -->
